```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | ResumeAI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(59, 130, 246, 0.20),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(139, 92, 246, 0.20),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #050b16,
                    #0b1220,
                    #10172a
                );

            color: white;
        }

        .card {
            width: 430px;
            max-width: 92%;

            padding: 45px;

            background: rgba(17, 28, 46, 0.90);

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.45);

            backdrop-filter: blur(20px);

            text-align: center;
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 36px;

            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,0.20),
                    rgba(139,92,246,0.20)
                );
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .description {
            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .error {
            background: rgba(239,68,68,0.10);

            border: 1px solid rgba(239,68,68,0.30);

            color: #f87171;

            padding: 11px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 13px;
        }

        .input-group {
            text-align: left;

            margin-bottom: 20px;
        }

        label {
            display: block;

            color: #cbd5e1;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.10);

            background: rgba(255,255,255,0.05);

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.3s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59,130,246,0.10);
        }

        .reset-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(59,130,246,0.25);
        }

        .back {
            margin-top: 22px;

            font-size: 13px;

            color: #94a3b8;
        }

        .back a {
            color: #60a5fa;

            text-decoration: none;

            font-weight: 600;
        }

        .back a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            🔐
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p class="description">
            Enter the email address you used to create your
            ResumeAI account. We'll help you reset your password.
        </p>

        {% if error %}

        <div class="error">
            ⚠️ {{ error }}
        </div>

        {% endif %}

        <!-- IMPORTANT: submit back to Flask route -->

        <form
            action="/forgot_password"
            method="POST"
        >

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>

            <button
                type="submit"
                class="reset-btn"
            >
                📧 Send Reset Link
            </button>

        </form>

        <div class="back">

            Remember your password?

            <a href="/login">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
```
