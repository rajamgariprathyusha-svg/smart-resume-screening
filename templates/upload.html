<form action="/analyze" method="POST" enctype="multipart/form-data">


<label>
Upload Resume PDF
</label>

<input 
type="file"
name="resume"
accept=".pdf"
required>


<label>
Job Description
</label>

<textarea 
name="job_description"
placeholder="Paste job description">
</textarea>


<button type="submit">
🔍 Analyze Resume
</button>


</form>
