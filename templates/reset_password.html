```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | ResumeAI</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            color: #f8fafc;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(59,130,246,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(139,92,246,0.20),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #050b16,
                    #0b1220,
                    #111827
                );

            overflow: hidden;
        }


        /* Animated background */

        .orb {

            position: fixed;

            border-radius: 50%;

            filter: blur(5px);

            opacity: 0.35;

            z-index: -1;

            animation: float 7s ease-in-out infinite;
        }


        .orb.one {

            width: 180px;
            height: 180px;

            background: #2563eb;

            top: 5%;
            left: 5%;
        }


        .orb.two {

            width: 230px;
            height: 230px;

            background: #7c3aed;

            bottom: -80px;
            right: 5%;

            animation-delay: 2s;
        }


        @keyframes float {

            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-25px);
            }

        }


        /* Main Card */

        .card {

            width: 470px;

            max-width: 100%;

            padding: 42px;

            background:
                rgba(15, 23, 42, 0.88);

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.50);

            backdrop-filter: blur(20px);

            animation: appear 0.7s ease;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* Logo */

        .logo {

            text-align: center;

            font-size: 25px;

            font-weight: 800;

            margin-bottom: 28px;

            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #a78bfa
                );

            

            -webkit-text-fill-color: transparent;

        }


        /* Icon */

        .lock-icon {

            width: 82px;

            height: 82px;

            margin:
                0 auto 22px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 39px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(59,130,246,0.18),
                    rgba(139,92,246,0.18)
                );

            border:
                1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 15px 35px rgba(59,130,246,0.12);

            animation:
                iconFloat 3s ease-in-out infinite;

        }


        @keyframes iconFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }

        }


        h1 {

            text-align: center;

            font-size: 29px;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;

        }


        /* Error */

        .error {

            padding: 12px 15px;

            margin-bottom: 20px;

            border-radius: 12px;

            background:
                rgba(239,68,68,0.10);

            border:
                1px solid rgba(239,68,68,0.25);

            color: #f87171;

            font-size: 13px;

        }


        /* Form */

        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            color: #cbd5e1;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;

        }


        .input-box {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;

        }


        input {

            width: 100%;

            padding:
                14px 48px
                14px 45px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.10);

            background:
                rgba(255,255,255,0.045);

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.3s;

        }


        input::placeholder {

            color: #64748b;

        }


        input:focus {

            border-color: #3b82f6;

            background:
                rgba(59,130,246,0.06);

            box-shadow:
                0 0 0 3px
                rgba(59,130,246,0.10);

        }


        /* Show password */

        .toggle {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #94a3b8;

            font-size: 16px;

            user-select: none;

        }


        /* Password strength */

        .strength-bars {

            display: flex;

            gap: 5px;

            margin-top: 9px;

        }


        .strength-bars span {

            height: 4px;

            flex: 1;

            border-radius: 5px;

            background: #263449;

            transition: 0.3s;

        }


        .strength-text {

            margin-top: 6px;

            color: #64748b;

            font-size: 11px;

        }


        /* Password match */

        .match-message {

            font-size: 11px;

            margin-top: 6px;

            min-height: 15px;

        }


        /* Button */

        .reset-btn {

            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 12px 30px
                rgba(59,130,246,0.20);

            transition: 0.3s;

        }


        .reset-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 16px 35px
                rgba(59,130,246,0.30);

        }


        .reset-btn:active {

            transform: scale(0.98);

        }


        /* Security note */

        .security {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 22px;

            color: #64748b;

            font-size: 11px;

        }


        /* Back */

        .back-login {

            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 13px;

        }


        .back-login a {

            color: #60a5fa;

            font-weight: 600;

            text-decoration: none;

        }


        .back-login a:hover {

            text-decoration: underline;

        }


        /* Mobile */

        @media(max-width: 500px) {

            .card {

                padding: 30px 23px;

                border-radius: 22px;

            }

            h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="orb one"></div>

    <div class="orb two"></div>


    <!-- Card -->

    <div class="card">


        <div class="logo">

            🤖 ResumeAI

        </div>


        <div class="lock-icon">

            🔐

        </div>


        <h1>

            Create New Password

        </h1>


        <p class="subtitle">

            Choose a strong password to keep your
            ResumeAI account secure.

        </p>


        {% if error %}

        <div class="error">

            ⚠️ {{ error }}

        </div>

        {% endif %}


        <form
            action="/reset_password"
            method="POST"
            onsubmit="return validatePassword()"
        >


            <!-- Email -->

            <input
                type="hidden"
                name="email"
                value="{{ email }}"
            >


            <!-- New Password -->

            <div class="form-group">

                <label for="password">

                    New Password

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        🔒

                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                        oninput="checkStrength()"
                    >


                    <span
                        class="toggle"
                        onclick="togglePassword(
                            'password',
                            this
                        )"
                    >

                        👁

                    </span>

                </div>


                <div class="strength-bars">

                    <span id="bar1"></span>

                    <span id="bar2"></span>

                    <span id="bar3"></span>

                    <span id="bar4"></span>

                </div>


                <div
                    class="strength-text"
                    id="strengthText"
                >

                    Password strength

                </div>

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">

                    Confirm New Password

                </label>


                <div class="input-box">

                    <span class="input-icon">

                        🔐

                    </span>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your new password"
                        required
                        oninput="checkMatch()"
                    >


                    <span
                        class="toggle"
                        onclick="togglePassword(
                            'confirm_password',
                            this
                        )"
                    >

                        👁

                    </span>

                </div>


                <div
                    class="match-message"
                    id="matchMessage"
                ></div>

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="reset-btn"
            >

                🔄 Update Password

            </button>


        </form>


        <!-- Security -->

        <div class="security">

            🔒 Your password is protected securely

        </div>


        <!-- Back -->

        <div class="back-login">

            Remember your password?

            <a href="/login">

                Back to Login

            </a>

        </div>


    </div>


    <script>


        /* Show / Hide Password */

        function togglePassword(id, element) {

            const input =
                document.getElementById(id);


            if (input.type === "password") {

                input.type = "text";

                element.textContent = "🙈";

            }

            else {

                input.type = "password";

                element.textContent = "👁";

            }

        }


        /* Password Strength */

        function checkStrength() {

            const password =
                document.getElementById(
                    "password"
                ).value;


            const bars = [

                document.getElementById("bar1"),

                document.getElementById("bar2"),

                document.getElementById("bar3"),

                document.getElementById("bar4")

            ];


            const text =
                document.getElementById(
                    "strengthText"
                );


            bars.forEach(function(bar) {

                bar.style.background =
                    "#263449";

            });


            if (password.length === 0) {

                text.textContent =
                    "Password strength";

            }

            else if (password.length < 6) {

                bars[0].style.background =
                    "#ef4444";

                text.textContent =
                    "Weak password";

            }

            else if (password.length < 10) {

                bars[0].style.background =
                    "#f59e0b";

                bars[1].style.background =
                    "#f59e0b";

                text.textContent =
                    "Medium password";

            }

            else if (
                password.match(/[A-Z]/) &&
                password.match(/[0-9]/) &&
                password.match(/[^A-Za-z0-9]/)
            ) {

                bars.forEach(function(bar) {

                    bar.style.background =
                        "#22c55e";

                });

                text.textContent =
                    "Strong password ✓";

            }

            else {

                bars[0].style.background =
                    "#f59e0b";

                bars[1].style.background =
                    "#f59e0b";

                bars[2].style.background =
                    "#f59e0b";

                text.textContent =
                    "Good password";

            }

        }


        /* Password Match */

        function checkMatch() {

            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirm =
                document.getElementById(
                    "confirm_password"
                ).value;


            const message =
                document.getElementById(
                    "matchMessage"
                );


            if (confirm.length === 0) {

                message.textContent = "";

                return;

            }


            if (password === confirm) {

                message.textContent =
                    "✓ Passwords match";

                message.style.color =
                    "#22c55e";

            }

            else {

                message.textContent =
                    "✕ Passwords do not match";

                message.style.color =
                    "#ef4444";

            }

        }


        /* Final validation */

        function validatePassword() {

            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirm =
                document.getElementById(
                    "confirm_password"
                ).value;


            if (password.length < 6) {

                alert(
                    "Password must contain at least 6 characters."
                );

                return false;

            }


            if (password !== confirm) {

                alert(
                    "Passwords do not match."
                );

                return false;

            }


            return true;

        }

    </script>


</body>

</html>
```
